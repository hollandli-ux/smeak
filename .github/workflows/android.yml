name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 自带 Android SDK，但许可证需显式接受，否则 sdkmanager 会卡在交互提示
      - name: Accept Android SDK licenses and install platform
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          yes | "$SM" "platform-tools" "platforms;android-36" > /dev/null 2>&1 || true

      - name: Install JS deps
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smeak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
